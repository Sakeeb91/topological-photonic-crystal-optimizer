# E1 cross-section bend-loss map (bare ring, exact 3D cylindrical MEEP, fixed m chosen from
# an MPB n_eff estimate so the resonance sits near 1547 nm). Picks the platform and the
# smallest radius with Q_bend >= 1e5, which E5 then uses.
# Harminv Q far above ~10 pi f T is an extrapolation: compare Q at T/2 and T in the output.
experiment: E1
grids:
  - kernel: bend_q
    tag: si220
    base: {platform: si220, res: 40, T_after: 2000}
    sweep:
      clad: [oxide, sub]          # oxide-clad, or uncladded (oxide below, air top)
      w: [0.45, 0.50, 0.60]
      R: [2.0, 3.0, 5.0, 10.0]
  - kernel: bend_q
    tag: sin400
    base: {platform: sin400, clad: oxide, res: 30, T_after: 2000}
    sweep:
      w: [0.8, 1.0, 1.2, 1.6]
      R: [10.0, 15.0, 20.0, 30.0]
